<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김우성 - 자기소개</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        h2 {
            color: #2980b9;
            font-size: 1.2em;
            margin-top: 25px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin-bottom: 20px;
            background-color: #ddd; /* 이미지가 없을 때 대체 배경색 */
        }
        ul {
            line-height: 1.6;
        }
        a {
            color: #e74c3c;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>김우성</h1>
        
        <!-- 프로필 이미지 -->
        <img src="https://via.placeholder.com/120" alt="프로필 이미지" class="profile-img">

        <h2>기본 정보</h2>
        <p><strong>학번:</strong> 22300161</p>
        <p><strong>전공:</strong> AI컴퓨터전산전자공학부 (<a href="https://www.handong.edu/" target="_blank">한동대학교</a>)</p>

        <h2>관심 분야 및 취미</h2>
        <ul>
            <li><strong>관심 분야:</strong> AI (인공지능)</li>
            <li><strong>취미:</strong> 애니메이션 시청</li>
        </ul>

        <h2>이번 학기에 배우고 싶은 것</h2>
        <ul>
            <li>오픈소스를 능숙하게 다루기</li>
            <li>웹 페이지를 자신 있게 만들기</li>
        </ul>

        <h2>만들어보고 싶은 서비스 또는 프로젝트</h2>
        <p><strong>한동 애니메이션 동아리(HAC)</strong> 웹페이지 및 챗봇 서비스</p>
    </div>

</body>
</html>
